<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#16213e">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <title>Fleet Tracker</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f0f2f5; color: #1a1a2e; overflow-x: hidden; }
    input, select, textarea, button { font-family: inherit; }

    /* LOGIN */
    .login-page { display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .login-box { background: #fff; padding: 32px 24px; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.1); width: 100%; max-width: 380px; }
    .login-box h1 { font-size: 26px; margin-bottom: 4px; color: #16213e; }
    .login-box h1 span { color: #e94560; }
    .login-box p { color: #888; margin-bottom: 24px; font-size: 14px; }
    .login-box input { width: 100%; padding: 14px 16px; border: 1.5px solid #e0e0e0; border-radius: 10px; font-size: 16px; margin-bottom: 12px; -webkit-appearance: none; }
    .login-box input:focus { outline: none; border-color: #0f3460; }
    .login-box button { width: 100%; padding: 14px; background: #0f3460; color: #fff; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; }
    .login-box button:active { background: #16213e; transform: scale(0.98); }
    .login-error { color: #e74c3c; font-size: 14px; margin-bottom: 12px; display: none; }

    /* APP SHELL */
    .app { display: none; padding-bottom: 70px; }

    /* TOP HEADER */
    .top-bar { position: sticky; top: 0; z-index: 50; background: #16213e; color: #fff; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; }
    .top-bar h1 { font-size: 18px; font-weight: 700; }
    .top-bar h1 span { color: #e94560; }
    .top-bar .user-badge { font-size: 12px; color: rgba(255,255,255,0.7); cursor: pointer; padding: 6px 12px; border: 1px solid rgba(255,255,255,0.2); border-radius: 20px; }
    .top-bar .user-badge:active { background: rgba(255,255,255,0.1); }

    /* BOTTOM NAV */
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; z-index: 50; background: #fff; border-top: 1px solid #e0e0e0; display: flex; padding-bottom: env(safe-area-inset-bottom, 0); }
    .bottom-nav a { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 8px 4px 6px; text-decoration: none; color: #999; font-size: 10px; font-weight: 600; gap: 2px; }
    .bottom-nav a.active { color: #0f3460; }
    .bottom-nav a svg { width: 22px; height: 22px; }
    .bottom-nav a.active svg { stroke: #0f3460; }

    /* PAGES */
    .main { padding: 0; }
    .page { display: none; padding: 16px; }
    .page.active { display: block; }
    .page-title { font-size: 20px; font-weight: 700; color: #16213e; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }

    /* STATS */
    .stats-scroll { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 8px; margin: 0 -16px; padding-left: 16px; padding-right: 16px; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
    .stats-scroll::-webkit-scrollbar { display: none; }
    .stat-card { background: #fff; padding: 14px 16px; border-radius: 12px; box-shadow: 0 1px 6px rgba(0,0,0,0.06); min-width: 140px; flex-shrink: 0; }
    .stat-card .label { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 0.5px; }
    .stat-card .value { font-size: 22px; font-weight: 700; color: #16213e; margin-top: 2px; }
    .stat-card .unit { font-size: 12px; color: #888; font-weight: 400; }

    /* CARDS */
    .card { background: #fff; border-radius: 12px; box-shadow: 0 1px 6px rgba(0,0,0,0.06); padding: 16px; margin-bottom: 12px; }
    .card h3 { font-size: 15px; margin-bottom: 12px; color: #16213e; font-weight: 700; }

    /* TRIP CARDS (mobile) */
    .trip-card { background: #fff; border-radius: 12px; box-shadow: 0 1px 6px rgba(0,0,0,0.06); padding: 14px 16px; margin-bottom: 10px; }
    .trip-card .trip-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
    .trip-card .trip-date { font-size: 12px; color: #888; }
    .trip-card .trip-number { font-size: 12px; color: #0f3460; font-weight: 700; background: #e8edf5; padding: 2px 8px; border-radius: 10px; }
    .trip-card .trip-route { font-size: 15px; font-weight: 600; color: #16213e; margin-bottom: 6px; }
    .trip-card .trip-details { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    .trip-card .trip-detail { text-align: center; }
    .trip-card .trip-detail .dl { font-size: 10px; color: #888; text-transform: uppercase; }
    .trip-card .trip-detail .dv { font-size: 14px; font-weight: 600; color: #333; }
    .trip-card .trip-customer { font-size: 12px; color: #666; margin-top: 8px; padding-top: 8px; border-top: 1px solid #f0f0f0; }
    .trip-card .trip-truck { font-size: 11px; color: #999; }
    .trip-card .trip-actions { margin-top: 8px; display: flex; justify-content: flex-end; }

    /* TRUCK CARDS */
    .truck-card { background: #fff; border-radius: 12px; box-shadow: 0 1px 6px rgba(0,0,0,0.06); padding: 14px 16px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    .truck-card .truck-info h4 { font-size: 16px; color: #16213e; margin-bottom: 2px; }
    .truck-card .truck-info p { font-size: 13px; color: #888; }
    .truck-card .truck-stats { text-align: right; }
    .truck-card .truck-stats .ts { font-size: 12px; color: #888; }
    .truck-card .truck-stats .tv { font-size: 15px; font-weight: 600; color: #16213e; }

    /* BUTTONS */
    .btn { padding: 10px 18px; border: none; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
    .btn:active { transform: scale(0.97); }
    .btn-primary { background: #0f3460; color: #fff; }
    .btn-danger { background: #e74c3c; color: #fff; }
    .btn-sm { padding: 7px 12px; font-size: 12px; }
    .btn-outline { background: transparent; border: 1.5px solid #ddd; color: #333; }

    /* FAB */
    .fab { position: fixed; bottom: 80px; right: 16px; z-index: 40; width: 56px; height: 56px; border-radius: 50%; background: #e94560; color: #fff; border: none; font-size: 28px; font-weight: 300; cursor: pointer; box-shadow: 0 4px 14px rgba(233,69,96,0.4); display: flex; align-items: center; justify-content: center; }
    .fab:active { transform: scale(0.92); }

    /* MODAL - Full screen on mobile */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 100; }
    .modal-overlay.open { display: flex; justify-content: center; align-items: flex-end; }
    .modal { background: #fff; border-radius: 20px 20px 0 0; padding: 20px; padding-bottom: 60px; width: 100%; max-height: 92vh; overflow-y: auto; -webkit-overflow-scrolling: touch; position: relative; }
    @supports (-webkit-touch-callout: none) { .modal { max-height: 80vh; } }
    .modal-handle { width: 40px; height: 4px; background: #ddd; border-radius: 2px; margin: 0 auto 16px; }
    .modal h3 { font-size: 18px; margin-bottom: 16px; color: #16213e; }
    .modal label { display: block; font-size: 13px; color: #666; margin-bottom: 4px; margin-top: 14px; font-weight: 500; }
    .modal input, .modal select, .modal textarea { width: 100%; padding: 12px 14px; border: 1.5px solid #e0e0e0; border-radius: 10px; font-size: 16px; -webkit-appearance: none; }
    .modal input:focus, .modal select:focus, .modal textarea:focus { outline: none; border-color: #0f3460; }
    .modal textarea { resize: vertical; min-height: 60px; }
    .modal-actions { display: flex; gap: 10px; margin-top: 20px; padding-bottom: env(safe-area-inset-bottom, 10px); }
    .modal-actions .btn { flex: 1; padding: 14px; justify-content: center; font-size: 15px; }

    /* EXPENSE SECTION */
    .expense-section { margin-top: 16px; border-top: 1px solid #f0f0f0; padding-top: 14px; }
    .expense-section-title { font-weight: 700; font-size: 15px; color: #16213e; margin-bottom: 12px; }
    .diesel-calc { margin-bottom: 14px; padding: 14px; background: #f8f9fa; border-radius: 10px; }
    .diesel-calc label { font-size: 13px; color: #555; margin: 0 0 4px; display: block; font-weight: 500; }
    .diesel-calc input { padding: 12px 14px; font-size: 16px; }
    .diesel-calc .dc-row { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
    .diesel-calc .dc-row > div { flex: 1; }
    .diesel-calc .dc-op { font-size: 18px; color: #bbb; text-align: center; flex: 0 0 20px; padding-top: 20px; }
    .diesel-calc .dc-result { margin-top: 10px; padding: 10px 14px; background: #e8f5e9; border-radius: 8px; font-size: 16px; font-weight: 600; color: #16213e; }
    .expense-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 10px; }
    .expense-field label { font-size: 11px; color: #777; margin: 0 0 2px; }
    .expense-field input { padding: 10px; font-size: 14px; }

    /* FILTERS */
    .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    .filters select, .filters input { padding: 10px 12px; border: 1.5px solid #e0e0e0; border-radius: 10px; font-size: 14px; -webkit-appearance: none; }

    /* BADGES */
    .badge { padding: 3px 10px; border-radius: 10px; font-size: 11px; font-weight: 700; text-transform: uppercase; }
    .badge-admin { background: #ffeaa7; color: #d35400; }
    .badge-staff { background: #dfe6e9; color: #2d3436; }
    .badge-viewer { background: #e8f5e9; color: #27ae60; }

    .empty { text-align: center; padding: 40px 20px; color: #999; font-size: 14px; }

    /* EXPENSE BREAKDOWN */
    .exp-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .exp-item { padding: 10px; background: #f8f9fa; border-radius: 8px; }
    .exp-item .el { font-size: 10px; color: #888; text-transform: uppercase; }
    .exp-item .ev { font-size: 16px; font-weight: 600; color: #16213e; }

    /* USER CARDS */
    .user-card { background: #fff; border-radius: 12px; box-shadow: 0 1px 6px rgba(0,0,0,0.06); padding: 14px 16px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    .user-card .ui h4 { font-size: 15px; color: #16213e; margin-bottom: 2px; }
    .user-card .ui p { font-size: 12px; color: #888; }

    /* USER MENU POPUP */
    .user-menu { display: none; position: fixed; top: 50px; right: 12px; z-index: 60; background: #fff; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.15); padding: 8px 0; min-width: 180px; }
    .user-menu.open { display: block; }
    .user-menu .um-header { padding: 12px 16px; border-bottom: 1px solid #f0f0f0; }
    .user-menu .um-header strong { display: block; font-size: 14px; color: #16213e; }
    .user-menu .um-header span { font-size: 12px; color: #888; }
    .user-menu a { display: block; padding: 12px 16px; font-size: 14px; color: #333; text-decoration: none; }
    .user-menu a:active { background: #f5f5f5; }
    .user-menu .um-logout { color: #e74c3c; border-top: 1px solid #f0f0f0; }

    /* DESKTOP (768px+) */
    @media (min-width: 769px) {
      .app { padding-bottom: 0; }
      .bottom-nav { display: none; }
      .top-bar { display: none; }
      .desktop-sidebar { display: block !important; position: fixed; left: 0; top: 0; bottom: 0; width: 220px; background: #16213e; color: #fff; padding: 20px 0; z-index: 50; }
      .desktop-sidebar h2 { padding: 0 20px; font-size: 18px; margin-bottom: 30px; }
      .desktop-sidebar h2 span { color: #e94560; }
      .desktop-sidebar a { display: block; padding: 12px 20px; color: rgba(255,255,255,0.7); text-decoration: none; font-size: 14px; }
      .desktop-sidebar a:hover, .desktop-sidebar a.active { color: #fff; background: rgba(255,255,255,0.1); }
      .desktop-sidebar .user-info { position: absolute; bottom: 20px; left: 20px; right: 20px; font-size: 12px; color: rgba(255,255,255,0.5); }
      .desktop-sidebar .user-info strong { color: rgba(255,255,255,0.8); display: block; font-size: 13px; }
      .desktop-sidebar .logout { color: #e94560; cursor: pointer; margin-top: 8px; display: inline-block; }
      .main { margin-left: 220px; }
      .page { padding: 24px; }
      .fab { bottom: 24px; right: 24px; }
      .modal-overlay.open { align-items: center; }
      .modal { border-radius: 16px; max-width: 520px; max-height: 85vh; }
      .stats-scroll { flex-wrap: wrap; overflow-x: visible; }
      .stat-card { min-width: 0; flex: 1 1 180px; }
      .trip-card .trip-details { grid-template-columns: repeat(4, 1fr); }
      .expense-grid { grid-template-columns: 1fr 1fr 1fr; }
    }

    /* DESKTOP SIDEBAR hidden on mobile */
    .desktop-sidebar { display: none; }
  </style>
</head>
<body>

<!-- LOGIN -->
<div class="login-page" id="loginPage">
  <div class="login-box">
    <h1>Fleet<span>Tracker</span></h1>
    <p>Log in to manage your fleet</p>
    <div class="login-error" id="loginError"></div>
    <input type="text" id="loginUser" placeholder="Username" autocomplete="username">
    <input type="password" id="loginPass" placeholder="Password" autocomplete="current-password">
    <button onclick="doLogin()">Log In</button>
  </div>
</div>

<!-- APP -->
<div class="app" id="app">
  <!-- TOP BAR (mobile) -->
  <div class="top-bar">
    <h1>Fleet<span>Tracker</span></h1>
    <div class="user-badge" id="topUserBadge" onclick="toggleUserMenu()"></div>
  </div>

  <!-- USER MENU -->
  <div class="user-menu" id="userMenu">
    <div class="um-header">
      <strong id="menuUserName"></strong>
      <span id="menuUserRole"></span>
    </div>
    <a href="#" class="um-logout" onclick="doLogout();return false;">Log Out</a>
  </div>

  <!-- DESKTOP SIDEBAR -->
  <nav class="desktop-sidebar">
    <h2>Fleet<span>Tracker</span></h2>
    <a href="#" data-page="dashboard" class="active">Dashboard</a>
    <a href="#" data-page="trips">Trips</a>
    <a href="#" data-page="trucks">Trucks</a>
    <a href="#" data-page="users" class="nav-users">Users</a>
    <div class="user-info">
      <strong id="deskUserName"></strong>
      <span id="deskUserRole"></span>
      <br><span class="logout" onclick="doLogout()">Log out</span>
    </div>
  </nav>

  <div class="main">
    <!-- DASHBOARD -->
    <div class="page active" id="pageDashboard">
      <div class="page-title">Dashboard</div>
      <div class="stats-scroll" id="dashStats"></div>
      <div class="card" id="dashExpenseBreakdown" style="display:none;margin-top:12px">
        <h3>Expense Breakdown</h3>
        <div id="dashExpenseDetails" class="exp-grid"></div>
      </div>
      <div style="margin-top:12px">
        <div class="page-title" style="font-size:16px">Recent Trips</div>
        <div id="dashTrips"></div>
      </div>
    </div>

    <!-- TRIPS -->
    <div class="page" id="pageTrips">
      <div class="page-title">
        Trips
        <button class="btn btn-outline btn-sm" onclick="exportCSV()">Export</button>
      </div>
      <div class="filters">
        <select id="filterTruck" style="flex:1"><option value="">All Trucks</option></select>
        <input type="date" id="filterFrom" style="flex:1">
        <input type="date" id="filterTo" style="flex:1">
        <button class="btn btn-primary btn-sm" onclick="loadTrips()">Go</button>
      </div>
      <div id="tripsContainer"></div>
    </div>

    <!-- TRUCKS -->
    <div class="page" id="pageTrucks">
      <div class="page-title">
        Trucks
        <button class="btn btn-primary btn-sm" id="btnAddTruck" onclick="toggleTruckForm()">+ Add</button>
      </div>
      <div id="truckFormBox" class="card" style="display:none;border:2px solid #0f3460;margin-bottom:16px;">
        <h3 id="truckModalTitle">Add Truck</h3>
        <input type="hidden" id="truckEditId">
        <div style="margin-bottom:12px;">
          <label style="display:block;font-size:13px;color:#555;margin-bottom:4px;font-weight:600;">Plate Number</label>
          <input type="text" id="truckPlate" placeholder="e.g. ABC-123XY" style="width:100%;padding:14px;border:1.5px solid #ddd;border-radius:10px;font-size:16px;">
        </div>
        <div style="margin-bottom:12px;">
          <label style="display:block;font-size:13px;color:#555;margin-bottom:4px;font-weight:600;">Truck Name</label>
          <input type="text" id="fld_truck_name" placeholder="e.g. DAF Truck, Blue Volvo" style="width:100%;padding:14px;border:1.5px solid #ddd;border-radius:10px;font-size:16px;">
        </div>
        <div style="display:flex;gap:10px;">
          <button class="btn btn-outline" onclick="toggleTruckForm()" style="flex:1;padding:14px;justify-content:center;">Cancel</button>
          <button class="btn btn-primary" onclick="saveTruck()" style="flex:1;padding:14px;justify-content:center;">Save</button>
        </div>
      </div>
      <div id="trucksContainer"></div>
    </div>

    <!-- USERS -->
    <div class="page" id="pageUsers">
      <div class="page-title">
        Users
        <button class="btn btn-primary btn-sm" onclick="openUserModal()">+ Add</button>
      </div>
      <div id="usersContainer"></div>
    </div>
  </div>

  <!-- FAB (add trip) -->
  <button class="fab" id="fabAdd" onclick="openTripModal()">+</button>

  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">
    <a href="#" data-page="dashboard" class="active">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-4 0a1 1 0 01-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 01-1 1h-2z"/></svg>
      Home
    </a>
    <a href="#" data-page="trips">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 17a2 2 0 11-4 0 2 2 0 014 0zM19 17a2 2 0 11-4 0 2 2 0 014 0z"/><path d="M13 16V6a1 1 0 00-1-1H4a1 1 0 00-1 1v10l2-1m2 0h6m4 0l2 1V8a1 1 0 00-.4-.8l-4-3a1 1 0 00-1.2 0l-4 3A1 1 0 0013 8z"/></svg>
      Trips
    </a>
    <a href="#" data-page="trucks">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="1" y="3" width="15" height="13" rx="1"/><path d="M16 8h4l3 3v5h-7V8z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>
      Trucks
    </a>
    <a href="#" data-page="users" class="nav-users">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>
      Users
    </a>
  </nav>
</div>

<!-- TRIP MODAL -->
<div class="modal-overlay" id="tripModal">
  <div class="modal">
    <div class="modal-handle"></div>
    <h3 id="tripModalTitle">Log Trip</h3>
    <input type="hidden" id="tripId">
    <label>Truck</label>
    <select id="tripTruck"></select>
    <label>Date</label>
    <input type="date" id="tripDate">
    <label>From</label>
    <input type="text" id="tripFrom" placeholder="Origin location">
    <label>To</label>
    <input type="text" id="tripTo" placeholder="Destination">
    <label>Distance (km)</label>
    <input type="number" id="tripDistance" inputmode="decimal" step="0.1">
    <label>Fuel (litres)</label>
    <input type="number" id="tripFuel" inputmode="decimal" step="0.1" oninput="calcDiesel()">
    <label>Customer</label>
    <input type="text" id="tripCustomer" placeholder="Customer name">
    <div style="margin-top:16px;border-top:1px solid #f0f0f0;padding-top:14px;">
      <div class="expense-section-title" style="color:#27ae60;">Income (Naira)</div>
      <div class="expense-grid">
        <div class="expense-field"><label>Charge to Customer</label><input type="number" id="tripCharge" inputmode="decimal" step="0.01" placeholder="0"></div>
        <div class="expense-field"><label>Haulage</label><input type="number" id="tripHaulage" inputmode="decimal" step="0.01" placeholder="0"></div>
      </div>
    </div>
    <div class="expense-section">
      <div class="expense-section-title">Expenses (Naira)</div>
      <div class="diesel-calc">
        <label>Diesel Price Per Litre (Naira)</label>
        <input type="number" id="dieselPricePerLitre" inputmode="decimal" step="0.01" placeholder="Enter current price per litre" oninput="calcDiesel()" style="background:#fff;">
        <div class="dc-row">
          <div><label>Litres</label><input type="number" id="dieselLitresDisplay" disabled style="background:#eee;"></div>
          <div class="dc-op">x</div>
          <div><label>Price/L</label><input type="number" id="dieselPriceDisplay" disabled style="background:#eee;"></div>
          <div class="dc-op">=</div>
          <div><label>Diesel Cost</label><input type="number" id="dieselCostDisplay" disabled style="background:#e8f5e9;font-weight:600;"></div>
        </div>
      </div>
      <div class="expense-grid" id="expenseFields"></div>
    </div>
    <label>Notes</label>
    <textarea id="tripNotes" placeholder="Optional notes"></textarea>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal('tripModal')">Cancel</button>
      <button class="btn btn-primary" onclick="saveTrip()">Save Trip</button>
    </div>
  </div>
</div>


<!-- USER MODAL -->
<div class="modal-overlay" id="userModal">
  <div class="modal">
    <div class="modal-handle"></div>
    <h3 id="userModalTitle">Add User</h3>
    <input type="hidden" id="userEditId">
    <label>Full Name</label>
    <input type="text" id="userFullName" placeholder="Full name">
    <label>Username</label>
    <input type="text" id="userUsername" placeholder="Login username">
    <label>Phone (WhatsApp)</label>
    <input type="tel" id="userPhone" placeholder="e.g. 2348012345678">
    <label>Role</label>
    <select id="userRoleSelect">
      <option value="staff">Staff</option>
      <option value="viewer">Viewer</option>
      <option value="admin">Admin</option>
    </select>
    <label>Password</label>
    <input type="password" id="userPassword" placeholder="Password">
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal('userModal')">Cancel</button>
      <button class="btn btn-primary" onclick="saveUser()">Save</button>
    </div>
  </div>
</div>

<script>
let token = localStorage.getItem('ft_token');
let currentUser = null;
let expenseCategories = [];

const fmt = n => Number(n||0).toLocaleString('en-NG', { minimumFractionDigits: 0, maximumFractionDigits: 1 });

async function api(url, opts = {}) {
  const headers = { 'Content-Type': 'application/json' };
  if (token) headers['Authorization'] = 'Bearer ' + token;
  const r = await fetch('/api' + url, { ...opts, headers });
  if (r.status === 401) { doLogout(); return null; }
  return r;
}

async function doLogin() {
  const username = document.getElementById('loginUser').value;
  const password = document.getElementById('loginPass').value;
  const r = await api('/auth/login', { method: 'POST', body: JSON.stringify({ username, password }) });
  if (!r) return;
  const data = await r.json();
  if (r.ok) {
    token = data.token;
    localStorage.setItem('ft_token', token);
    currentUser = data.user;
    showApp();
  } else {
    const el = document.getElementById('loginError');
    el.textContent = data.error || 'Login failed';
    el.style.display = 'block';
  }
}

function doLogout() {
  token = null; currentUser = null;
  localStorage.removeItem('ft_token');
  document.getElementById('app').style.display = 'none';
  document.getElementById('loginPage').style.display = 'flex';
  document.getElementById('userMenu').classList.remove('open');
}

function toggleUserMenu() {
  document.getElementById('userMenu').classList.toggle('open');
}

document.addEventListener('click', function(e) {
  if (!e.target.closest('#userMenu') && !e.target.closest('#topUserBadge')) {
    document.getElementById('userMenu').classList.remove('open');
  }
});

async function showApp() {
  if (!currentUser) {
    const r = await api('/auth/me');
    if (!r || !r.ok) { doLogout(); return; }
    currentUser = await r.json();
  }
  document.getElementById('loginPage').style.display = 'none';
  document.getElementById('app').style.display = 'block';

  document.getElementById('topUserBadge').textContent = currentUser.name.split(' ')[0];
  document.getElementById('menuUserName').textContent = currentUser.name;
  document.getElementById('menuUserRole').textContent = currentUser.role;
  document.getElementById('deskUserName').textContent = currentUser.name;
  document.getElementById('deskUserRole').textContent = currentUser.role;

  var isAdmin = currentUser.role === 'admin';
  var canLog = ['admin','staff'].includes(currentUser.role);
  document.querySelectorAll('.nav-users').forEach(function(el) { el.style.display = isAdmin ? '' : 'none'; });
  document.getElementById('fabAdd').style.display = canLog ? 'flex' : 'none';
  document.getElementById('btnAddTruck').style.display = isAdmin ? 'inline-flex' : 'none';

  const catR = await api('/trips/categories');
  if (catR && catR.ok) { expenseCategories = await catR.json(); buildExpenseFields(); }

  loadDashboard();
}

function buildExpenseFields() {
  document.getElementById('expenseFields').innerHTML = expenseCategories.map(function(c) {
    return '<div class="expense-field"><label>' + c.label + '</label><input type="number" id="exp_' + c.key + '" inputmode="decimal" step="0.01" placeholder="0"></div>';
  }).join('');
}

function switchPage(name) {
  document.querySelectorAll('.bottom-nav a, .desktop-sidebar a').forEach(function(a) { a.classList.toggle('active', a.dataset.page === name); });
  document.querySelectorAll('.page').forEach(function(p) { p.classList.remove('active'); });
  document.getElementById('page' + name.charAt(0).toUpperCase() + name.slice(1)).classList.add('active');
  document.getElementById('userMenu').classList.remove('open');
  if (name === 'dashboard') loadDashboard();
  if (name === 'trips') loadTrips();
  if (name === 'trucks') loadTrucks();
  if (name === 'users') loadUsers();
}

document.querySelectorAll('.bottom-nav a[data-page], .desktop-sidebar a[data-page]').forEach(function(a) {
  a.addEventListener('click', function(e) { e.preventDefault(); switchPage(a.dataset.page); });
});

function renderTripCard(t, showActions) {
  var totalIncome = (t.customer_charge || 0) + (t.haulage || 0);
  var hasIncome = totalIncome > 0;
  var grossColor = t.gross_profit >= 0 ? '#27ae60' : '#e74c3c';
  var netColor = t.net_profit >= 0 ? '#27ae60' : '#e74c3c';
  return '<div class="trip-card">' +
    '<div class="trip-header">' +
      '<div><span class="trip-date">' + t.trip_date + '</span> <span class="trip-truck">' + (t.truck_name || '') + ' ' + (t.truck_plate || '') + '</span></div>' +
      '<span class="trip-number">Trip #' + (t.trip_number || 1) + '</span>' +
    '</div>' +
    '<div class="trip-route">' + t.origin + ' &rarr; ' + t.destination + '</div>' +
    '<div class="trip-details" style="grid-template-columns:1fr 1fr;">' +
      '<div class="trip-detail" style="text-align:left"><div class="dl">Income</div><div class="dv" style="color:#27ae60">' + (hasIncome ? fmt(totalIncome) : '-') + '</div></div>' +
      '<div class="trip-detail" style="text-align:left"><div class="dl">Expenses (excl. Driver)</div><div class="dv" style="color:#e74c3c">' + fmt((t.total_expenses||0) - (t.driver_motoboy||0)) + '</div></div>' +
      '<div class="trip-detail" style="text-align:left"><div class="dl">Gross Profit</div><div class="dv" style="color:' + grossColor + ';font-weight:700">' + (hasIncome ? fmt(t.gross_profit) : '-') + '</div></div>' +
      '<div class="trip-detail" style="text-align:left"><div class="dl">Driver/Motoboy</div><div class="dv">' + fmt(t.driver_motoboy) + '</div></div>' +
      '<div class="trip-detail" style="text-align:left"><div class="dl">Net Profit</div><div class="dv" style="color:' + netColor + ';font-weight:700">' + (hasIncome ? fmt(t.net_profit) : '-') + '</div></div>' +
      '<div class="trip-detail" style="text-align:left"><div class="dl">Distance</div><div class="dv">' + fmt(t.distance_km) + ' km</div></div>' +
    '</div>' +
    '<div class="trip-customer">Customer: ' + (t.customer_name || '-') + '</div>' +
    (showActions && currentUser.role === 'admin' ? '<div class="trip-actions"><button class="btn btn-danger btn-sm" onclick="deleteTrip(' + t.id + ')">Delete</button></div>' : '') +
  '</div>';
}

async function loadDashboard() {
  const [statsR, tripsR] = await Promise.all([api('/stats/summary'), api('/trips?limit=5')]);
  if (!statsR) return;
  const stats = await statsR.json();
  const trips = await tripsR.json();

  document.getElementById('dashStats').innerHTML =
    '<div class="stat-card"><div class="label">Trips</div><div class="value">' + stats.total_trips + '</div></div>' +
    '<div class="stat-card"><div class="label">Distance</div><div class="value">' + fmt(stats.total_km) + ' <span class="unit">km</span></div></div>' +
    '<div class="stat-card"><div class="label">Revenue</div><div class="value">' + fmt(stats.total_revenue) + ' <span class="unit">NGN</span></div></div>' +
    '<div class="stat-card"><div class="label">Expenses</div><div class="value">' + fmt(stats.total_expenses) + ' <span class="unit">NGN</span></div></div>' +
    '<div class="stat-card" style="border-left:3px solid ' + (stats.gross_profit >= 0 ? '#27ae60' : '#e74c3c') + '"><div class="label">Gross Profit</div><div class="value" style="color:' + (stats.gross_profit >= 0 ? '#27ae60' : '#e74c3c') + '">' + fmt(stats.gross_profit) + ' <span class="unit">NGN</span></div></div>' +
    '<div class="stat-card"><div class="label">Driver/Motoboy</div><div class="value">' + fmt(stats.driver_motoboy) + ' <span class="unit">NGN</span></div></div>' +
    '<div class="stat-card" style="border-left:3px solid ' + (stats.net_profit >= 0 ? '#27ae60' : '#e74c3c') + '"><div class="label">Net Profit</div><div class="value" style="color:' + (stats.net_profit >= 0 ? '#27ae60' : '#e74c3c') + '">' + fmt(stats.net_profit) + ' <span class="unit">NGN</span></div></div>' +
    '<div class="stat-card"><div class="label">Efficiency</div><div class="value">' + (stats.avg_efficiency || 0) + ' <span class="unit">km/L</span></div></div>';

  var expCard = document.getElementById('dashExpenseBreakdown');
  var expDetails = document.getElementById('dashExpenseDetails');
  if (stats.expenses_by_category && Object.keys(stats.expenses_by_category).length > 0) {
    expCard.style.display = 'block';
    var catMap = {};
    expenseCategories.forEach(function(c) { catMap[c.key] = c.label; });
    expDetails.innerHTML = Object.entries(stats.expenses_by_category).map(function(e) {
      return '<div class="exp-item"><div class="el">' + (catMap[e[0]] || e[0]) + '</div><div class="ev">' + fmt(e[1]) + '</div></div>';
    }).join('');
  } else { expCard.style.display = 'none'; }

  document.getElementById('dashTrips').innerHTML = trips.length === 0
    ? '<div class="empty">No trips yet. Tap + to log your first trip.</div>'
    : trips.map(function(t) { return renderTripCard(t, false); }).join('');
}

async function loadTrips() {
  const trucksR = await api('/trucks');
  if (!trucksR) return;
  const trucks = await trucksR.json();
  var sel = document.getElementById('filterTruck');
  var tripSel = document.getElementById('tripTruck');
  sel.innerHTML = '<option value="">All Trucks</option>' + trucks.map(function(t) { return '<option value="' + t.id + '">' + t.name + ' (' + t.plate + ')</option>'; }).join('');
  tripSel.innerHTML = trucks.map(function(t) { return '<option value="' + t.id + '">' + t.name + ' (' + t.plate + ')</option>'; }).join('');

  var url = '/trips?';
  var tid = sel.value, fd = document.getElementById('filterFrom').value, td2 = document.getElementById('filterTo').value;
  if (tid) url += 'truck_id=' + tid + '&';
  if (fd) url += 'from_date=' + fd + '&';
  if (td2) url += 'to_date=' + td2 + '&';

  const r = await api(url);
  if (!r) return;
  const trips = await r.json();
  document.getElementById('tripsContainer').innerHTML = trips.length === 0
    ? '<div class="empty">No trips found</div>'
    : trips.map(function(t) { return renderTripCard(t, true); }).join('');
}

async function loadTrucks() {
  const r = await api('/trucks');
  if (!r) return;
  const trucks = await r.json();
  var isAdmin = currentUser.role === 'admin';
  document.getElementById('trucksContainer').innerHTML = trucks.length === 0
    ? '<div class="empty">No trucks yet</div>'
    : trucks.map(function(t) {
      return '<div class="truck-card">' +
        '<div class="truck-info"><h4>' + t.name + '</h4><p>' + t.plate + '</p></div>' +
        '<div class="truck-stats">' +
          '<div><span class="ts">Trips:</span> <span class="tv">' + t.total_trips + '</span></div>' +
          '<div><span class="ts">km:</span> <span class="tv">' + fmt(t.total_km) + '</span></div>' +
          (isAdmin ? '<button class="btn btn-outline btn-sm" style="margin-top:6px" onclick="editTruck(' + t.id + ',\'' + t.plate.replace(/'/g,"\\'") + '\',\'' + t.name.replace(/'/g,"\\'") + '\')">Edit</button>' : '') +
        '</div></div>';
    }).join('');
}

async function loadUsers() {
  const r = await api('/users');
  if (!r) return;
  const users = await r.json();
  document.getElementById('usersContainer').innerHTML = users.map(function(u) {
    return '<div class="user-card">' +
      '<div class="ui"><h4>' + u.name + '</h4><p>@' + u.username + (u.phone ? ' | ' + u.phone : '') + '</p></div>' +
      '<div style="display:flex;align-items:center;gap:8px;">' +
        '<span class="badge badge-' + u.role + '">' + u.role + '</span>' +
        (u.id !== currentUser.id ? '<button class="btn btn-danger btn-sm" onclick="deleteUser(' + u.id + ')">Del</button>' : '') +
      '</div></div>';
  }).join('');
}

function openTripModal(trip) {
  document.getElementById('tripModalTitle').textContent = trip ? 'Edit Trip' : 'Log Trip';
  document.getElementById('tripId').value = trip ? trip.id : '';
  document.getElementById('tripDate').value = trip ? trip.trip_date : new Date().toISOString().split('T')[0];
  document.getElementById('tripFrom').value = trip ? trip.origin : '';
  document.getElementById('tripTo').value = trip ? trip.destination : '';
  document.getElementById('tripDistance').value = trip ? trip.distance_km : '';
  document.getElementById('tripFuel').value = trip ? trip.fuel_litres : '';
  document.getElementById('tripCharge').value = trip ? trip.customer_charge : '';
  document.getElementById('tripHaulage').value = trip ? trip.haulage : '';
  document.getElementById('tripCustomer').value = trip ? trip.customer_name : '';
  document.getElementById('tripNotes').value = trip ? trip.notes || '' : '';
  var savedPrice = localStorage.getItem('ft_diesel_price') || '';
  document.getElementById('dieselPricePerLitre').value = savedPrice;
  document.getElementById('dieselLitresDisplay').value = trip ? trip.fuel_litres : '';
  document.getElementById('dieselPriceDisplay').value = savedPrice;
  document.getElementById('dieselCostDisplay').value = '';
  expenseCategories.forEach(function(c) {
    var el = document.getElementById('exp_' + c.key);
    if (el) el.value = (trip && trip.expenses && trip.expenses[c.key]) ? trip.expenses[c.key] : '';
  });
  document.getElementById('tripModal').classList.add('open');
}

function calcDiesel() {
  var litres = parseFloat(document.getElementById('tripFuel').value) || 0;
  var price = parseFloat(document.getElementById('dieselPricePerLitre').value) || 0;
  document.getElementById('dieselLitresDisplay').value = litres || '';
  document.getElementById('dieselPriceDisplay').value = price || '';
  var cost = litres * price;
  document.getElementById('dieselCostDisplay').value = cost > 0 ? cost : '';
  if (cost > 0) { var el = document.getElementById('exp_diesel'); if (el) el.value = cost; }
  if (price > 0) localStorage.setItem('ft_diesel_price', price);
}

async function saveTrip() {
  var expenses = {};
  expenseCategories.forEach(function(c) {
    var el = document.getElementById('exp_' + c.key);
    var val = el ? parseFloat(el.value) || 0 : 0;
    if (val > 0) expenses[c.key] = val;
  });
  var id = document.getElementById('tripId').value;
  var body = {
    truck_id: parseInt(document.getElementById('tripTruck').value),
    trip_date: document.getElementById('tripDate').value,
    origin: document.getElementById('tripFrom').value,
    destination: document.getElementById('tripTo').value,
    distance_km: parseFloat(document.getElementById('tripDistance').value),
    fuel_litres: parseFloat(document.getElementById('tripFuel').value),
    customer_charge: parseFloat(document.getElementById('tripCharge').value) || 0,
    haulage: parseFloat(document.getElementById('tripHaulage').value) || 0,
    customer_name: document.getElementById('tripCustomer').value,
    notes: document.getElementById('tripNotes').value,
    expenses: expenses
  };
  if (!body.origin || !body.destination || !body.distance_km || !body.fuel_litres || !body.customer_name || !body.trip_date) {
    alert('Please fill all required fields'); return;
  }
  var r = await api('/trips' + (id ? '/' + id : ''), { method: id ? 'PUT' : 'POST', body: JSON.stringify(body) });
  if (r && r.ok) { closeModal('tripModal'); loadTrips(); loadDashboard(); }
  else { var d = await r.json(); alert(d.error || 'Error saving trip'); }
}

async function deleteTrip(id) {
  if (!confirm('Delete this trip?')) return;
  await api('/trips/' + id, { method: 'DELETE' });
  loadTrips(); loadDashboard();
}

function toggleTruckForm() {
  var box = document.getElementById('truckFormBox');
  if (box.style.display === 'none') {
    document.getElementById('truckModalTitle').textContent = 'Add Truck';
    document.getElementById('truckEditId').value = '';
    document.getElementById('truckPlate').value = '';
    document.getElementById('fld_truck_name').value = '';
    box.style.display = 'block';
    document.getElementById('truckPlate').focus();
  } else {
    box.style.display = 'none';
  }
}

function editTruck(id, plate, name) {
  document.getElementById('truckModalTitle').textContent = 'Edit Truck';
  document.getElementById('truckEditId').value = id;
  document.getElementById('truckPlate').value = plate;
  document.getElementById('fld_truck_name').value = name;
  document.getElementById('truckFormBox').style.display = 'block';
  document.getElementById('fld_truck_name').focus();
}

async function saveTruck() {
  var id = document.getElementById('truckEditId').value;
  var body = { plate: document.getElementById('truckPlate').value, name: document.getElementById('fld_truck_name').value };
  if (!body.plate) { alert('Plate number is required'); return; }
  var r = await api('/trucks' + (id ? '/' + id : ''), { method: id ? 'PUT' : 'POST', body: JSON.stringify(body) });
  if (r && r.ok) { document.getElementById('truckFormBox').style.display = 'none'; loadTrucks(); }
  else { var d = await r.json(); alert(d.error || 'Error'); }
}

function openUserModal() {
  document.getElementById('userModalTitle').textContent = 'Add User';
  document.getElementById('userEditId').value = '';
  document.getElementById('userFullName').value = '';
  document.getElementById('userUsername').value = '';
  document.getElementById('userPhone').value = '';
  document.getElementById('userRoleSelect').value = 'staff';
  document.getElementById('userPassword').value = '';
  document.getElementById('userModal').classList.add('open');
}

async function saveUser() {
  var id = document.getElementById('userEditId').value;
  var body = {
    name: document.getElementById('userFullName').value,
    username: document.getElementById('userUsername').value,
    phone: document.getElementById('userPhone').value,
    role: document.getElementById('userRoleSelect').value,
    password: document.getElementById('userPassword').value
  };
  if (!body.name || !body.username || (!id && !body.password)) { alert('Fill all required fields'); return; }
  var r = await api('/users' + (id ? '/' + id : ''), { method: id ? 'PUT' : 'POST', body: JSON.stringify(body) });
  if (r && r.ok) { closeModal('userModal'); loadUsers(); }
  else { var d = await r.json(); alert(d.error || 'Error'); }
}

async function deleteUser(id) {
  if (!confirm('Delete this user?')) return;
  await api('/users/' + id, { method: 'DELETE' });
  loadUsers();
}

function exportCSV() {
  var url = '/api/trips/export/csv?';
  var tid = document.getElementById('filterTruck').value;
  var fd = document.getElementById('filterFrom').value;
  var td2 = document.getElementById('filterTo').value;
  if (tid) url += 'truck_id=' + tid + '&';
  if (fd) url += 'from_date=' + fd + '&';
  if (td2) url += 'to_date=' + td2 + '&';
  window.open(url, '_blank');
}

function closeModal(id) { document.getElementById(id).classList.remove('open'); }

document.querySelectorAll('.modal-overlay').forEach(function(m) {
  m.addEventListener('click', function(e) { if (e.target === m) m.classList.remove('open'); });
});

document.getElementById('loginPass').addEventListener('keypress', function(e) { if (e.key === 'Enter') doLogin(); });
document.getElementById('loginUser').addEventListener('keypress', function(e) { if (e.key === 'Enter') document.getElementById('loginPass').focus(); });

document.addEventListener('focusin', function(e) {
  if (e.target.matches('.modal input, .modal select, .modal textarea')) {
    setTimeout(function() {
      e.target.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }, 100);
    setTimeout(function() {
      e.target.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }, 400);
  }
});

if (token) showApp();
</script>
</body>
</html>

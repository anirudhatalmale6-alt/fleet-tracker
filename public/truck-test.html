<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Truck Test</title>
</head>
<body style="padding:30px;font-family:sans-serif;">
  <h2>Truck Input Test</h2>
  <p>Tap each field below. Does the keyboard appear?</p>
  <br>
  <label>Field 1 - Plate Number:</label><br>
  <input type="text" placeholder="Type here" style="width:100%;padding:15px;font-size:18px;border:2px solid blue;margin:5px 0 20px 0;border-radius:8px;">
  <br>
  <label>Field 2 - Truck Name:</label><br>
  <input type="text" placeholder="Type here" style="width:100%;padding:15px;font-size:18px;border:2px solid red;margin:5px 0 20px 0;border-radius:8px;">
  <br>
  <label>Field 3 - Another test:</label><br>
  <textarea placeholder="Type here" style="width:100%;padding:15px;font-size:18px;border:2px solid green;margin:5px 0;border-radius:8px;height:60px;"></textarea>
</body>
</html>
